name: Build and Deploy Anki Add-on

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Card templates fall back to CDN files at the release tag. Those files
      # must match the exact build being packaged, including hashed chunks.
      - name: Verify committed frontend assets
        run: |
          if [ -n "$(git status --porcelain -- better-markdown-anki/dist)" ]; then
            echo "Committed frontend assets are stale. Build and commit dist before tagging."
            git status --short -- better-markdown-anki/dist
            exit 1
          fi

      - name: Test add-on
        run: python3 -m unittest discover -s tests -v

      - name: Embed release tag and package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/package_addon.py --tag "$RELEASE_TAG" --output "better-markdown-anki-${RELEASE_TAG}.ankiaddon"

      - name: Upload release package
        uses: softprops/action-gh-release@v2
        with:
          files: better-markdown-anki-*.ankiaddon
          fail_on_unmatched_files: true

  deploy-website:
    needs: build-and-deploy
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/configure-pages@v5
      - name: Build the website
        run: python3 website/build.py --output "$RUNNER_TEMP/bma-website"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/bma-website
      - id: deployment
        uses: actions/deploy-pages@v4
